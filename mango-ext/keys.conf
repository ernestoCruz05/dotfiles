# --- APPS ---
bind=SUPER,b,spawn,firefox
bind=SUPER,Return,spawn,st
bind=SUPER,e,spawn,thunar
bind=SUPER,d,spawn,~/.config/rofi/launcher.sh 

# --- Utility ---
bind=SUPER,q,killclient
bind=SUPER,m,quit
bind=SUPER,space,togglefloating

# --- Window/Workspace Overview ---
bind=SUPER,Tab,focusstack,next

# Clipboard Manager
bind=SUPER,v,spawn,sh -c "cliphist list | rofi -dmenu -p 'Clipboard' | cliphist decode | wl-copy"

# Reload config
bind=SUPER,r,reload_config

# switch window focus
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
#bind=SUPER+Alt,Left,tagmon,left
#bind=SUPER+Alt,Right,tagmon,right

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Canvas Stuff
mousebind=SUPER,btn_side,toggleminimap
bind=SUPER,P,canvas_overview_toggle
bind=SUPER,SPACE,canvas_centerview
mousebind=Super,btn_middle,canvas_fill_viewport,
axisbind=SUPER,UP,canvas_zoom_resize,1.3
axisbind=SUPER,DOWN,canvas_zoom_resize,0.7
axis_bind_apply_timeout=0
mousebind = ALT, BTN_MIDDLE, canvas_drag_pan

# --- Mplug ---
bind=SUPER,s,spawn_shell,mplug trigger screenshot_full
bind=SUPER+SHIFT,s,spawn_shell,mplug trigger screenshot

bind=SUPER+SHIFT,c,spawn_shell,mplug trigger clock_calendar
#bind=SUPER+SHIFT,d,spawn_shell,mplug trigger sysinfo

# Solo triggers
bind=SUPER+SHIFT,r,spawn_shell,mplug trigger radar
bind=SUPER+SHIFT,a,spawn_shell,mplug trigger audio_switcher
bind=SUPER+SHIFT,x,spawn_shell,mplug trigger power_menu
bind=SUPER+SHIFT,g,spawn_shell,mplug trigger dunst_gif

bind=NONE,XF86Tools,spawn_shell,mplug trigger volume_down
bind=NONE,XF86Launch5,spawn_shell,mplug trigger volume_mute
bind=NONE,XF86Launch6,spawn_shell,mplug trigger volume_up
bind=NONE,XF86Launch7,spawn_shell,mplug trigger media_playpause
bind=NONE,XF86Launch8,spawn_shell,mplug trigger media_next

# Per-app volume — hover a window (sloppyfocus) + SUPER+ALT scroll
axisbind=SUPER+ALT,UP,spawn_shell,mplug trigger app_vol_up
axisbind=SUPER+ALT,DOWN,spawn_shell,mplug trigger app_vol_down
bind=SUPER+ALT,m,spawn_shell,mplug trigger app_vol_mute
# Fallback if axisbind can't run spawn_shell on your mango build — use keys instead:
#bind=SUPER+ALT,equal,spawn_shell,mplug trigger app_vol_up
#bind=SUPER+ALT,minus,spawn_shell,mplug trigger app_vol_down


# Brightness — laptop only
#bind=NONE,XF86MonBrightnessDown,spawn_shell,mplug trigger brightness_down
#bind=NONE,XF86MonBrightnessUp,spawn_shell,mplug trigger brightness_up
